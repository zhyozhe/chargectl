description "charge keeper mini app"
start on stopped iptables and stopped ip6tables and starting failsafe
stop on stopping failsafe or starting halt or starting reboot
respawn
oom score never
pre-start script
  mkdir -p /usr/local/share/chargectl
end script
script
  exec /usr/local/bin/chargectl >>/var/log/chargectl.log 2>&1
end script
